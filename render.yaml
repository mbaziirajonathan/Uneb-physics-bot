services:
    - type: web
    name: digital-uneb-tutor
    env: python
    runtime: python-3.10.14  # <-- This fixes tiktoken + torch + faiss
    plan: starter  # 512MB RAM. Change to standard for 1GB
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    autoDeploy: true
    envVars:
            - key: PYTHON_VERSION
        value: 3.10.14
            - key: DEPLOY_ENV
        value: cloud
            - key: OPENROUTER_API_KEY
        sync: false  # Set this in Render Dashboard > Environment
            - key: STUDENT_PASSWORD
        value: 1234
            - key: ADMIN_PASSWORD
        value: admin123
